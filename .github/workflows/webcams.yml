name: Update webcam photos
on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: webcams
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_webcams.py
      - name: Commit if changed
        run: |
          git config user.name "webcam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webcams.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Update webcam photos"
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          fi
