name: Update measured snow depth
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: snow
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_snow.py
      - name: Commit if changed
        run: |
          git config user.name "snow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snow.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Update measured snow depth"
            git pull --rebase -q origin main && git push
          fi
